<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Prediction System</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f1f5f9;margin:0;padding:0}
.navbar{background:#0f172a;color:white;padding:14px 20px;font-weight:700;font-size:18px}
.container{max-width:800px;margin:20px auto;padding:0 15px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,0.08);border:1px solid #e2e8f0}
h2{text-align:center;color:#0f172a;margin-top:0}
.sub{color:#64748b;text-align:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:600;color:#475569;margin-bottom:4px;display:block}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;box-sizing:border-box}
input:focus,select:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 2px rgba(59,130,246,0.2)}
.actions{text-align:center;margin-top:18px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
.btn-primary{background:#2563eb;color:white}
.btn-primary:hover{background:#1d4ed8}
#result{margin-top:18px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;text-align:center;font-weight:700;display:none}
#result.success{display:block;background:#f0fdf4;border-color:#bbf7d0;color:#166534}
#result.error{display:block;background:#fef2f2;border-color:#fecaca;color:#991b1b}
</style>
</head>
<body>

<div class="navbar">🌍 Area Prediction System</div>

<div class="container">
<div class="card">
<h2>Area Prediction</h2>
<p class="sub">Estimate affected/land area from site and weather features.</p>

<form id="mainForm" onsubmit="return false;">
<div class="grid">
<div><label>Event Date</label><input type="date" name="event_date" value="2022-10-10" required></div>
<div><label>Region</label><select name="region" required><option value="East" selected>East</option><option value="West">West</option><option value="North">North</option><option value="South">South</option><option value="R1">R1</option></select></div>

<div><label>Latitude</label><input type="number" step="0.0001" name="latitude" value="30.5" required></div>
<div><label>Longitude</label><input type="number" step="0.0001" name="longitude" value="78.2" required></div>

<div><label>Elevation (m)</label><input type="number" step="0.1" name="elevation_m" value="4" required></div>
<div><label>Rainfall (mm)</label><input type="number" step="0.1" name="rainfall_mm" value="3" required></div>

<div><label>Temperature (°C)</label><input type="number" step="0.1" name="temperature_c" value="6" required></div>
<div><label>Population Density</label><input type="number" step="1" name="population_density" value="4" required></div>

<div><label>Prior Area (ha)</label><input type="number" step="0.1" name="prior_area_ha" value="3" required></div>
<div><label>Land Cover</label><select name="land_cover" required><option value="forest" selected>forest</option><option value="urban">urban</option><option value="water">water</option><option value="agriculture">agriculture</option><option value="barren">barren</option></select></div>
</div>

<div class="actions">
<button type="button" class="btn btn-primary" id="predictBtn" onclick="doPredict()">Predict area</button>
</div>
</form>

<div id="result"></div>

</div>
</div>

<script>
async function doPredict(){
  const btn = document.getElementById('predictBtn');
  const resDiv = document.getElementById('result');
  const form = document.getElementById('mainForm');
  const fd = new FormData(form);
  let obj = {};
  fd.forEach((v,k)=>{ obj[k]=v; });

  // number me convert
  ['latitude','longitude','elevation_m','rainfall_mm','temperature_c','population_density','prior_area_ha'].forEach(k=>{
    if(obj[k]) obj[k]=parseFloat(obj[k]);
  });

  btn.innerText='Predicting...';
  btn.disabled=true;
  resDiv.style.display='block';
  resDiv.className='';
  resDiv.innerText='Loading...';

  try{
    const r = await fetch('/predict', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(obj)
    });
    const d = await r.json();
    console.log(d);
    if(!r.ok || d.error){
      resDiv.className='error';
      resDiv.innerText='Error: '+(d.error||'Prediction failed');
    }else{
      resDiv.className='success';
      resDiv.innerHTML = `Predicted Area: <br>
        <span style="font-size:22px">${Number(d.predicted_area_ha).toFixed(2)} ha</span><br>
        ${Number(d.acres||d.predicted_area_ha*2.471).toFixed(2)} acres | 
        ${Number(d.sqkm||d.predicted_area_ha*0.01).toFixed(4)} sq.km`;
    }
  }catch(e){
    resDiv.className='error';
    resDiv.innerText='Server Error: '+e.message+' (check app.py is running)';
  }
  btn.innerText='Predict area';
  btn.disabled=false;
}
</script>

</body>
</html>
